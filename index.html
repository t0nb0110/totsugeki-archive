<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Character Abilities</title><style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;padding:18px;background:transparent;color:CanvasText}.wrap{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1{font-size:20px;margin:0}.muted{opacity:.62;font-size:12px}.panel{border:1px solid color-mix(in srgb,CanvasText 17%,transparent);border-radius:14px;padding:16px}.updated{grid-column:1/-1;text-align:right;font-size:11px;opacity:.62;overflow-wrap:anywhere}.personal{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(145px,1fr);gap:18px}.radar{width:100%;height:auto;display:block;overflow:visible}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:center}.stat{padding:12px;background:color-mix(in srgb,CanvasText 5%,transparent);border-radius:10px}.stat .value{font-size:23px;font-weight:700;margin-top:3px}.rank{font-size:11px;opacity:.7}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}select{padding:9px;border-radius:8px;font:inherit;max-width:100%;background:Canvas;color:CanvasText;border:1px solid color-mix(in srgb,CanvasText 25%,transparent)}.barrow{display:grid;grid-template-columns:190px minmax(0,1fr) 46px;gap:12px;align-items:center;margin:10px 0}.barname{overflow-wrap:anywhere;font-size:13px}.track{height:17px;background:color-mix(in srgb,CanvasText 8%,transparent);border-radius:4px;overflow:hidden}.fill{height:100%;border-radius:4px}.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}.note{font-size:12px;opacity:.65;margin-top:12px}.error{color:#c33;white-space:pre-wrap}@media(max-width:560px){body{padding:9px}.personal{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.stat{padding:7px}.stat .value{font-size:18px}.barrow{grid-template-columns:130px minmax(0,1fr) 35px;gap:6px}}
</style></head><body><main class="wrap" id="app">読み込み中…</main><script>
// Google Sheetsで「ウェブに公開」したCSVのURLを設定してください。
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSOL9D_Ab0JioQtr6k1kokSnsyft2IDKIVd9Zj-J3Mu-nARKQC0ro-KKNsdHxO7Lyd9XTewfmEbq6-1/pub?gid=0&single=true&output=csv';
const MAIN=['STR','CON','POW','DEX','APP','SIZ','INT','EDU'];
const SUB=['HP','MP','SAN','神話技能'];
const MAX={STR:18,CON:18,POW:18,DEX:18,APP:18,SIZ:18,INT:18,EDU:21};
const ALL=[...MAIN,...SUB];
const DEFAULT_COLOR='#638BBF';
function parseCSV(src){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<src.length;i++){const c=src[i];if(quoted){if(c==='"'&&src[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&src[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function color(c){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:DEFAULT_COLOR}
// 手入力日付をタイムゾーン変換せずに整形する。
function formatUpdatedDate(value){if(!value)return '';const m=/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/.exec(value);if(!m)throw Error('更新日はYYYY/MM/DD形式で入力してください');const y=Number(m[1]),month=Number(m[2]),day=Number(m[3]);const leap=y%4===0&&(y%100!==0||y%400===0);const days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];if(y<1||month<1||month>12||day<1||day>days[month-1])throw Error('更新日に存在しない日付が入力されています');return m[1]+'/'+m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0')}
function loadRecords(csv){const rows=parseCSV(csv.replace(/^\uFEFF/,''));const head=rows.shift().map(s=>s.trim());const required=['ID','名前','カラー',...ALL];const missing=required.filter(k=>!head.includes(k));if(missing.length)throw Error('CSVに必要な列がありません: '+missing.join(', '));const ids=new Set();return rows.map((r,idx)=>{const obj=Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()]));if(!obj.ID)return null;if(ids.has(obj.ID))throw Error('IDが重複しています: '+obj.ID);ids.add(obj.ID);try{obj['更新日']=formatUpdatedDate(obj['更新日'])}catch(e){throw Error(`${idx+2}行目: ${e.message}`)}for(const k of ALL){if(obj[k]===''||!Number.isFinite(Number(obj[k])))throw Error(`${idx+2}行目の${k}が数値ではありません`);obj[k]=Number(obj[k])}return obj}).filter(Boolean)}
function rank(rows,item,value){return 1+rows.filter(r=>r[item]>value).length}
function rankLabel(rows,item,value){const others=rows.filter(r=>r[item]===value).length-1;return `${rank(rows,item,value)}位(${others>0?'他'+others+'人':'単独'})`}
function point(cx,cy,r,i,n){const a=-Math.PI/2+2*Math.PI*i/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function poly(points){return points.map(p=>p.map(x=>x.toFixed(2)).join(',')).join(' ')}
function radarSVG(ch,rows){const cx=250,cy=245,R=160,n=8,co=color(ch['カラー']);let out=`<svg class="radar" viewBox="0 0 500 500" role="img" aria-label="${escapeHTML(ch['名前'])}のレーダーチャート">`;for(let j=1;j<=4;j++)out+=`<polygon points="${poly(MAIN.map((_,i)=>point(cx,cy,R*j/4,i,n)))}" fill="none" stroke="currentColor" stroke-opacity=".17"/>`;MAIN.forEach((k,i)=>{const p=point(cx,cy,R,i,n);out+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="currentColor" stroke-opacity=".13"/>`});const pts=MAIN.map((k,i)=>point(cx,cy,R*ch[k]/MAX[k],i,n));out+=`<polygon points="${poly(pts)}" fill="${co}" fill-opacity=".22" stroke="${co}" stroke-width="3" stroke-linejoin="round"/>`;pts.forEach(p=>out+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${co}"/>`);MAIN.forEach((k,i)=>{const p=point(cx,cy,R+38,i,n);const rk=rankLabel(rows,k,ch[k]);out+=`<text x="${p[0]}" y="${p[1]-5}" text-anchor="middle" fill="currentColor" font-size="15" font-weight="650">${k} ${ch[k]}</text><text x="${p[0]}" y="${p[1]+12}" text-anchor="middle" fill="${co}" font-size="12">${rk}</text>`});return out+'</svg>'}
function personal(ch,rows){const co=color(ch['カラー']);const stats=SUB.map(k=>`<div class="stat"><div class="muted">${k}</div><div class="value">${ch[k]}${k==='神話技能'?'%':''}</div><div class="rank">全体 ${rankLabel(rows,k,ch[k])}</div></div>`).join('');return `<div class="head"><h1>${escapeHTML(ch['名前'])}</h1><span class="muted"><span style="color:${co}">●</span> ABILITY PROFILE</span></div><div class="panel personal">${radarSVG(ch,rows)}<section class="stats">${stats}</section>${ch['更新日']?`<div class="updated">更新日：${escapeHTML(ch['更新日'])}</div>`:''}</div><div class="note">情報は最新ではない可能性があります。</div>`}
function comparison(rows){const options=ALL.map(k=>`<option value="${k}">${k}</option>`).join('');return `<div class="head"><h1>全キャラクター能力値比較</h1><span class="muted">${rows.length}人</span></div><div class="panel"><div class="controls"><label for="metric">比較する能力値</label><select id="metric">${options}</select></div><div id="bars"></div><div class="note">情報は最新ではない可能性があります。</div></div>`}
function renderBars(rows,metric){const sorted=[...rows].sort((a,b)=>b[metric]-a[metric]||a['名前'].localeCompare(b['名前'],'ja'));const high=Math.max(1,...sorted.map(r=>r[metric]));document.getElementById('bars').innerHTML=sorted.map(ch=>`<div class="barrow"><div class="barname" title="${escapeHTML(ch['名前'])}">${rankLabel(rows,metric,ch[metric])} ${escapeHTML(ch['名前'])}</div><div class="track"><div class="fill" style="width:${Math.max(0,ch[metric])/high*100}%;background:${color(ch['カラー'])}"></div></div><div class="num">${ch[metric]}${metric==='神話技能'?'%':''}</div></div>`).join('')}
(async()=>{const app=document.getElementById('app');try{if(CSV_URL.startsWith('PASTE_'))throw Error('index.htmlのCSV_URLを設定してください。');const res=await fetch(CSV_URL,{cache:'no-store'});if(!res.ok)throw Error('CSVを取得できません (HTTP '+res.status+')');const rows=loadRecords(await res.text());if(!rows.length)throw Error('キャラクターデータがありません');const q=new URLSearchParams(location.search);if(q.get('view')==='all'){app.innerHTML=comparison(rows);const select=document.getElementById('metric');select.addEventListener('change',()=>renderBars(rows,select.value));renderBars(rows,select.value)}else{const id=q.get('char')||rows[0].ID;const ch=rows.find(r=>r.ID===id);if(!ch)throw Error('指定されたIDが見つかりません: '+id);app.innerHTML=personal(ch,rows)}}catch(e){app.innerHTML=`<div class="panel error">${escapeHTML(e.message)}</div>`}})();
</script></body></html>
